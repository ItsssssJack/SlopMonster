name: slop gate

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The catalogue is regexes, so the regression suite is the only thing
      # standing between a tweak and a silently half-blind linter.
      - name: Regression tests
        run: python3 tools/test_deslop.py

      # The copy/notes split is what keeps the model's change notes out of
      # cleansed.md. No model calls, so it runs here like any other unit test.
      - name: Cleanse split tests
        run: bash tools/test_cleanse.sh

      # This is the gate itself, copied as-is into your own repo: point it at
      # whatever file holds your shipped copy. Non-zero below 6/6 fails the build.
      - name: Lint the shipped copy
        run: python3 tools/deslop.py --text "$(cat examples/gate-sample.txt)"

      # The README claims it passes the scorer it documents. Asserting that in
      # prose is how it quietly stopped being true; rule 6 caught four sentences
      # of its own cadence. Enforce it instead.
      - name: The docs pass their own scorer
        run: |
          for f in README.md SKILL.md references/*.md examples/*.md; do
            python3 tools/deslop.py "$f"
          done
